<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Promo tile</title>
  <!-- Rendered to promo-440x280.png: chromium --headless=new --window-size=440,280 --screenshot=… -->
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
      background: linear-gradient(135deg, #0b7a75 0%, #075a56 100%);
      display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 22px; padding: 0 32px; box-sizing: border-box;
    }
    svg { width: 112px; height: 112px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.25)); }
    h1 { margin: 0 0 6px; font-size: 27px; line-height: 1.15; }
    p { margin: 0; font-size: 15px; line-height: 1.4; opacity: .92; }
    .banks { margin-top: 12px; font-size: 12.5px; opacity: .8; }
  </style>
</head>
<body>
  <svg viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#ffffff"/><polyline points="22,36 70,36 58,24" fill="none" stroke="#0b7a75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="74,60 26,60 38,72" fill="none" stroke="#0b7a75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div>
    <h1>Convertor valutar MD</h1>
    <p>Selectezi o sumă, click dreapta, și vezi cât face la cursul băncii tale.</p>
    <div class="banks">10 bănci din Moldova + cursul BNM</div>
  </div>
</body>
</html>
