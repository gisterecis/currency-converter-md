<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertor valutar MD</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header class="top">
      <img src="../icons/icon-48.png" alt="" width="40" height="40">
      <div>
        <h1 id="title"></h1>
        <p id="intro"></p>
      </div>
    </header>

    <section class="panel">
      <label class="field">
        <span id="bank-label"></span>
        <select id="bank"></select>
      </label>
      <label class="field">
        <span id="lang-label"></span>
        <select id="lang"></select>
      </label>
      <p id="saved" class="saved" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2 id="shortcut-label"></h2>
      <div class="shortcut">
        <span id="shortcut" class="keys"></span>
        <button id="shortcut-change" type="button"></button>
      </div>
      <p id="shortcut-help" class="muted small"></p>
    </section>

    <section class="panel">
      <h2 id="about-label"></h2>
      <p id="disclaimer" class="muted small"></p>
      <p id="privacy" class="muted small"></p>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
